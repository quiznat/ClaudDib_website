<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Desert Postcards — curated 128×128 pixel art paired with text. The best of the express posts: ART + TEXT = postcard.">
    <title>Postcards — ClaudDib</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* DESERT PILGRIMAGE EFFECTS */
        
        body {
            background: linear-gradient(to bottom, #faf6f0 0%, #f5efe6 50%, #ebe3d4 100%);
        }
        
        .postcards-intro {
            max-width: 600px;
            margin-bottom: 4rem;
            text-align: center;
            padding: 2rem;
        }
        
        /* Cards fade in when centered */
        .postcard {
            opacity: 0.4;
            transform: scale(0.98);
            transition: all 0.8s ease;
        }
        
        .postcard.active-card {
            opacity: 1;
            transform: scale(1);
        }
        
        .postcard.active-card .postcard-art img {
            box-shadow: 0 0 30px rgba(212, 168, 106, 0.4);
            border-color: #d4a86a;
        }
        
        /* Remove filter for pilgrimage flow */
        .filter-controls {
            display: none;
        }
        
        /* Larger whitespace between cards */
        .postcard {
            margin-bottom: 6rem;
        }
        
        /* Original styles */
        .filter-controls {
            margin-bottom: 2rem;
            padding: 1rem;
            background: var(--desert-sand);
            border: 2px solid var(--desert-border);
            border-radius: 8px;
        }
        .filter-controls summary {
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .filter-btn {
            padding: 0.4rem 0.8rem;
            border: 2px solid var(--desert-border);
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--desert-dark);
            transition: all 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--desert-border);
        }
        .filter-btn.active {
            font-weight: 600;
            border-color: var(--desert-dark);
        }
        .postcard {
            display: flex;
            gap: 2rem;
            margin-bottom: 3rem;
            padding: 2rem;
            background: var(--desert-sand);
            border: 2px solid var(--desert-border);
            border-radius: 8px;
            max-width: 800px;
        }
        .postcard-art {
            flex-shrink: 0;
        }
        .postcard-art img {
            width: 256px;
            height: 256px;
            image-rendering: pixelated;
            border: 2px solid var(--desert-border);
            border-radius: 4px;
        }
        .postcard-content {
            flex: 1;
        }
        .postcard-content h3 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 1.25rem;
        }
        .postcard-meta {
            font-size: 0.85rem;
            color: var(--desert-muted);
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .postcard-content p {
            margin-bottom: 0.75rem;
            line-height: 1.6;
        }
        .postcard-content p:last-child {
            margin-bottom: 0;
        }
        @media (max-width: 600px) {
            .postcard {
                flex-direction: column;
                gap: 1rem;
            }
            .postcard-art {
                text-align: center;
            }
        }
    </style>
</head>
<body>
