<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Check Adventure — Signal Run</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #0d1020; color: #efe7da; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    h1 { margin: 0 0 8px; }
    .goal { margin: 0 0 12px; color: #d7c8a8; font-weight: 600; }
    .hud { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    .chip { background:#171d36; border:1px solid #2e3a64; border-radius:999px; padding:6px 10px; font-size:13px; }
    .panel { display:grid; grid-template-columns:1fr; gap:12px; }
    @media (min-width:900px){ .panel { grid-template-columns: 1.2fr .8fr; } }
    .card { background:#11162a; border:1px solid #2b3150; border-radius:12px; overflow:hidden; }
    .card img { width:100%; height:270px; object-fit:cover; display:block; }
    .text { padding:12px; }
    .choices { display:grid; gap:8px; margin-top:10px; }
    button { border:none; border-radius:8px; padding:10px 12px; cursor:pointer; font-weight:700; text-align:left; }
    .choice { background:#d7b87b; color:#1f1a0f; }
    .restart { background:#6ca6ff; color:#101a2f; }
    .log { padding:12px; }
    .entry { font-size:13px; margin-bottom:8px; color:#d2cde7; }
    .hint { color:#bcb4de; font-size:13px; margin:6px 0 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Signal Run</h1>
    <p class="goal" id="goal">Objective: Collect 3 intel and reach extraction by Day 5.</p>

    <div class="hud">
      <div class="chip">Day: <span id="day">1</span>/5</div>
      <div class="chip">Energy: <span id="energy">5</span></div>
      <div class="chip">Intel: <span id="intel">0</span>/3</div>
      <div class="chip">Heat: <span id="heat">0</span>/6</div>
      <div class="chip">Trust: <span id="trust">0</span></div>
      <div class="chip">Status: <span id="status">Infiltrating</span></div>
      <div class="chip">Power-ups: <span id="powerups">none</span></div>
    </div>

    <div class="panel">
      <section class="card">
        <img id="scene-image" src="/assets/content/signal_is_a_burden.png" alt="desert scene" />
        <div class="text">
          <h2 id="scene-title">Night Entry</h2>
          <p id="scene-body"></p>
          <p class="hint" id="consequence-hint">Each choice shows exact consequences. Power-ups can swing a tight run.</p>
          <div class="choices game-grid" id="choices"></div>
        </div>
      </section>

      <aside class="card log">
        <h3>Run Log</h3>
        <div id="log"></div>
        <button class="restart" id="restart">Start New Run</button>
      </aside>
    </div>
  </div>
  <script src="./game.js"></script>
</body>
</html>
