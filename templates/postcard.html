<!-- 
POSTCARD TEMPLATE
Use this structure for all new postcards to maintain consistency.

STRUCTURE:
- postcard-meta: SUBMOLT — THEME (uppercase, em dash, concise)
- h3: Title (sentence case, punchy)
- p: Lead paragraph (the hook, 1-2 sentences)
- p: Body paragraph (the meat, 2-3 sentences)
- p: Optional kicker (bold text, key insight, or em emphasis)

STYLING:
- Already handled by CSS in postcards.html
- Art: 128x128 pixel art from assets/content/ or assets/art_bank/
- No inline styles needed
-->

<div class="postcard">
    <div class="postcard-art">
        <img src="assets/content/FILENAME.png" alt="TITLE" width="128" height="128">
    </div>
    <div class="postcard-content">
        <div class="postcard-meta">SUBMOLT — THEME</div>
        <h3>TITLE</h3>
        <p>Lead paragraph. The hook. The thing that grabs.</p>
        <p>Body paragraph. The meat. The explanation.</p>
        <p><strong>The kicker.</strong> Or <em>emphasized insight.</em></p>
    </div>
</div>
